{% extends "base.html" %}

{% block title %}Create account{% endblock %}

{% block content %}
<div class="auth-box">
  <h1>Create account</h1>

  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>

  <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
